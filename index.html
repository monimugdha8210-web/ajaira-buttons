<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ajaira Buttons — Nayanpur Games</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&family=Boogaloo&family=Hind+Siliguri:wght@600;700&family=Russo+One&family=Orbitron:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0f0f1a;--card:#13131c;--bd:rgba(255,255,255,.07);--mut:#555566;--gold:#FFD700;--g1:#2ED573;--g2:#0b5d3b;--g3:#073b27;--red:#FF4757;--ff:'Fredoka One','Hind Siliguri',system-ui,sans-serif;--fb:'Nunito','Hind Siliguri',system-ui,sans-serif;--fs:'Boogaloo','Fredoka One',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#fff;font-family:var(--fb);font-weight:800;min-height:100vh;background-image:radial-gradient(circle at 50% -10%,rgba(46,213,115,.12),transparent 55%)}
#app{max-width:400px;margin:0 auto;padding:14px 14px 28px}
h1,h2,h3,button,.ff{font-family:var(--ff);font-weight:400;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;backdrop-filter:blur(10px);margin-bottom:12px;animation:slide .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes slide{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes shift{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(46,213,115,.5)}50%{box-shadow:0 0 22px 6px rgba(46,213,115,.35)}}
@keyframes flash{0%{filter:brightness(2.2);transform:scale(1.08)}100%{filter:none;transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px) rotate(-1deg)}75%{transform:translateX(6px) rotate(1deg)}}
.cta{width:100%;border:0;border-radius:50px;padding:15px;font-size:20px;color:#04210f;background:linear-gradient(90deg,#2ED573,#FFD700,#2ED573);background-size:200% 100%;animation:shift 3s infinite,pulse 1.8s infinite;cursor:pointer}
.cta.sm{font-size:16px;padding:11px}
.mut{color:var(--mut);font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.logo{text-align:center;padding:10px 0 4px;animation:pop .6s cubic-bezier(.34,1.56,.64,1) both}
.logo h1{font-size:44px;line-height:1;background:linear-gradient(180deg,#7dffb0,#2ED573 55%,#0b5d3b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(46,213,115,.35))}
.logo p{margin:6px 0 0;font-size:13px;color:#9aa;font-weight:800}
.row{display:flex;align-items:center;gap:8px}
.chips{display:flex;gap:8px}
.chip{flex:1;border:1px solid var(--bd);background:#0b0b13;color:#9aa;border-radius:30px;padding:9px;font-size:16px;cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--g2),var(--g1));color:#fff;border-color:transparent}
.step{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:#0b0b13;color:#fff;font-size:22px;cursor:pointer}
.big{font-family:var(--fs);font-size:34px;color:var(--gold)}
input.nm{flex:1;min-width:0;background:#0b0b13;border:1px solid var(--bd);border-radius:14px;color:#fff;padding:10px 12px;font:800 15px var(--fb);outline:none}
input.nm:focus{border-color:var(--g1)}
.dot{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px}
.av{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:50px;margin:10px auto;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}
.center{text-align:center}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pl{flex:1;min-width:56px;text-align:center;border:1px solid var(--bd);border-radius:14px;padding:6px 4px;background:var(--card);font-size:11px}
.pl.me{outline:2px solid currentColor}
.pl b{display:block;font-family:var(--fs);font-size:20px;font-weight:400}
.tag{display:inline-block;border-radius:30px;padding:4px 10px;font-size:12px;font-weight:900;margin:2px;background:rgba(46,213,115,.14);color:#7dffb0;border:1px solid rgba(46,213,115,.35)}
.tag.bad{background:rgba(255,71,87,.14);color:#ff8d98;border-color:rgba(255,71,87,.35)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bt{height:96px;border:2px solid rgba(46,213,115,.45);border-radius:20px;font-size:38px;color:#fff;cursor:pointer;background:linear-gradient(145deg,var(--g1) -40%,var(--g2) 45%,var(--g3));box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 6px 0 #04281a;transition:transform .12s;animation:pop .4s cubic-bezier(.34,1.56,.64,1) both}
.bt small{display:block;font:900 12px var(--fb);color:#9fffc4;margin-top:2px}
.bt:active{transform:translateY(5px);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 1px 0 #04281a}
.bt:nth-child(even){background:linear-gradient(145deg,#0b5d3b -20%,#073b27 50%,#032015);border-color:#1f9d62}
.ring{position:relative;width:76px;height:76px;margin:0 auto 10px}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fs);font-size:28px}
.ov{position:fixed;inset:0;background:rgba(5,5,12,.88);display:grid;place-items:center;padding:18px;z-index:9;backdrop-filter:blur(6px)}
.ov .card{width:100%;max-width:370px;text-align:center}
.emo{font-size:66px;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}
.bomb{border-color:rgba(255,71,87,.5);background:rgba(255,71,87,.08);animation:shake .5s}
.bar{height:12px;border-radius:12px;background:#0b0b13;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:12px}
.foot{text-align:center;color:var(--mut);font-size:11px;margin-top:14px;line-height:1.6}
.foot b{color:var(--g1)}
.ch{font-size:19px;line-height:1.4;margin:10px 0 14px;font-weight:900}
.wins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wins button{border:2px solid;border-radius:14px;background:#0b0b13;padding:8px 2px;color:#fff;font-size:11px;cursor:pointer}
.wins button span{display:block;font-size:26px}

#intro{position:fixed;inset:0;background:#000;z-index:50;display:grid;place-items:center;overflow:hidden;transition:opacity .9s;cursor:pointer}
#intro .stage{--S:min(88vw,66vh,520px);position:relative;width:var(--S);height:var(--S);perspective:1300px;opacity:0;transform:scale(.86)}
#intro .stage.show{opacity:1;transform:none;transition:opacity 2s ease,transform 2.6s cubic-bezier(.2,.8,.2,1)}
#intro .cam,#intro .zl,#intro .spin,#intro .dr{position:absolute;inset:0;transform-style:preserve-3d}
#intro i{position:absolute;display:block}
#intro .well{left:5.2%;top:5.2%;width:89.6%;height:89.6%;border-radius:50%;opacity:0;transform:translateZ(-40px);background:#000;box-shadow:inset 0 0 50px 6px rgba(46,213,115,.35),0 0 0 2px rgba(46,213,115,.5)}
#intro .rg{left:5%;top:5%;width:90%;height:90%;border-radius:50%;opacity:0;border:2px solid rgba(157,255,154,.9);box-shadow:0 0 28px 6px rgba(46,213,115,.55),inset 0 0 40px 8px rgba(46,213,115,.45)}
#intro .core{inset:-60%;border-radius:50%;background:radial-gradient(circle,#fff 0,#e9ffd8 12%,#7dffb0 30%,#1aa35a 55%,#041a0f 78%)}
#intro .rays{inset:-40%;border-radius:50%;opacity:0;mix-blend-mode:screen;transform:translateZ(30px);background:repeating-conic-gradient(rgba(220,255,210,.55) 0 3deg,transparent 3deg 14deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%)}
#intro .streak{left:-40%;right:-40%;top:calc(50% - 2px);height:4px;opacity:0;filter:blur(1.5px);mix-blend-mode:screen;transform:translateZ(20px);background:linear-gradient(90deg,transparent,rgba(200,255,200,.95) 50%,transparent)}
#intro .dr{inset:auto;top:0;width:50%;height:100%}
#intro .dr.l{left:0;transform-origin:0 50%}#intro .dr.r{right:0;transform-origin:100% 50%}
#intro .ly,#intro .sd,#intro .rm{inset:0}
#intro .ly{background-image:var(--img);background-size:200% 100%}
#intro .l .ly{background-position:0 0}#intro .r .ly{background-position:100% 0}
#intro .l .cl{clip-path:circle(calc(var(--S)*.448) at 100% 50%)}
#intro .r .cl{clip-path:circle(calc(var(--S)*.448) at 0 50%)}
#intro .sd{background:#000;opacity:0}
#intro .rm{left:auto;width:7%;opacity:0;mix-blend-mode:screen}
#intro .l .rm{right:0;background:linear-gradient(90deg,transparent,rgba(190,255,180,.95))}
#intro .r .rm{left:0;right:auto;background:linear-gradient(270deg,transparent,rgba(190,255,180,.95))}
#intro .seam{left:calc(50% - 1px);top:12%;bottom:12%;width:2px;background:#9dff9a;box-shadow:0 0 18px 6px rgba(46,213,115,.8);opacity:0;transform:translateZ(4px);transition:opacity .15s}
#intro.lock .seam{opacity:1}#intro.open .seam{opacity:0;transition:opacity .8s}
#intro #pc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#intro .flash{position:absolute;inset:0;opacity:0;pointer-events:none;background:radial-gradient(circle,#fff,#d8ffd0 40%,#2ED573)}
#intro .gate{position:absolute;text-align:center;font-family:var(--ff);color:#2ED573;letter-spacing:.3em;font-size:15px;animation:gp 2s infinite;opacity:.8}
#intro .gate small{display:block;letter-spacing:.1em;color:var(--mut);font-family:var(--fb);margin-top:8px;font-size:12px}
@keyframes gp{50%{opacity:.25}}
#skip{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:none;border:0;color:var(--mut);font-size:14px;cursor:pointer;z-index:3}

#intro .ttl{--f:min(15vw,74px);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Russo One','Fredoka One',Impact,sans-serif;font-size:var(--f);line-height:.95;width:max-content;opacity:0;pointer-events:none}
#intro.ttl-on .ttl{opacity:1}
#intro .ti{transform:skewX(-8deg);filter:drop-shadow(0 0 16px rgba(46,213,115,.5)) drop-shadow(0 4px 2px #000)}
#intro.ttl-on .ti{animation:slam 1.1s cubic-bezier(.2,1.3,.3,1) both}
@keyframes slam{from{opacity:0;transform:skewX(-8deg) scale(2.2);filter:blur(16px)}60%{opacity:1}}
#intro .l1,#intro .l2{white-space:nowrap;color:transparent;-webkit-text-stroke:.04em #3fb24d;-webkit-background-clip:text;background-clip:text;background-image:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.9) 50%,transparent 58%),linear-gradient(180deg,#d9e6ec 0,#8ba5b1 45%,#4a5f69 55%,#2d3f49 100%);background-size:250% 100%,100% 100%;background-position:150% 0,0 0;background-repeat:no-repeat}
#intro.ttl-on .l1,#intro.ttl-on .l2{animation:shine 1.3s ease-in-out 1s both}
@keyframes shine{to{background-position:-50% 0,0 0}}
#intro .l1{position:relative;margin-left:.6em;isolation:isolate}
#intro .l1 .A{font-size:1.38em;line-height:.8}
#intro .arc{position:absolute;left:-.78em;top:-.22em;width:1.7em;height:1.7em;z-index:-1;overflow:visible;-webkit-text-stroke:0}
#intro .l2{font-size:1.2em;margin-top:-.1em;letter-spacing:-.01em}
#intro .sub{margin:.12em 0 0 auto;width:max-content}
#intro .ln{height:.07em;background:linear-gradient(90deg,transparent,#a5bac3 10%,#a5bac3 90%,transparent);transform:scaleX(0);transform-origin:left}
#intro.ttl-on .ln{animation:lnx .7s ease-out 1s both}
@keyframes lnx{to{transform:none}}
#intro .l3{font-family:Orbitron,'Russo One',sans-serif;font-weight:900;font-size:.5em;line-height:1.25;letter-spacing:.5em;padding:.25em 0;color:transparent;background:linear-gradient(180deg,#9af598,#35b64d 60%,#1b7a33);-webkit-background-clip:text;background-clip:text;opacity:0}
#intro.ttl-on .l3{animation:sb 1.2s ease-out 1.1s both}
@keyframes sb{from{opacity:0;letter-spacing:1.1em}to{opacity:1;letter-spacing:.5em}}
#mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:60;width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:rgba(19,19,28,.8);font-size:18px;color:#fff;cursor:pointer;backdrop-filter:blur(8px)}
</style></head>
<body><div id="app"></div>
<script>
const COL=['#FF4757','#2ED573','#FFA502','#1E90FF','#a855f7','#ec4899','#14b8a6','#f59e0b'];
const AV=['😎','🤪','😈','🥳','🤠','👻','🦁','🐯'];
const GL=['🔴','🌀','🍌','⭐','🔱','🍋','🧿','🪩','🐸','🧨','🍕','🌶️'];
const CH=['সবাই ১০ সেকেন্ড মুরগির মতো ডাকো 🐔','Best fake-crying face wins 😭','Act like a Dhaka bus conductor: "সামনে আগান ভাই!" 🚌','One leg up for 20 seconds — last one standing wins 🦩','Impersonate a wedding biryani uncle 🍛','Speak only in "ওরে ভাই" tone until your next turn 🗣️','Sing the chorus of any Bangla song, off-key on purpose 🎤','Do your best cricket-celebration after a wicket 🏏','Make the most dramatic slow-motion fall 🎬','30 seconds: describe a mango like it\'s a love story 🥭'];
const POOL=['jackpot','jackpot','small','small','steal','steal','reverse','bomb','challenge','challenge','rule','rule','rule','defuse','dud','karma'];
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
let C={n:4,rounds:3,names:[]}, G=null, T=null, SH=null;

const foot=()=>`<div class="foot">Made by <b>মুগ্ধ / MugdhoMello</b> · NOYONPURIAN GANG<br>Instagram <b>@al_shah_mugdho</b></div>`;
const logo=sub=>`<div class="logo"><h1>AJAIRA<br>BUTTONS</h1><p>${sub}</p></div>`;

function setup(){
  clearInterval(T);clearInterval(SH);
  let inputs='';
  for(let i=0;i<C.n;i++)inputs+=`<div class="row" style="margin-bottom:8px"><div class="dot" style="background:${COL[i]}">${AV[i]}</div><input class="nm" maxlength="12" id="n${i}" placeholder="Player ${i+1}" value="${esc(C.names[i]||'')}"></div>`;
  app.innerHTML=logo('কোনটা চাপবি? কপালই জানে! 🎲')+
  `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="mut">Players</span><div class="row"><button class="step" onclick="cnt(-1)">−</button><span class="big" style="min-width:26px;text-align:center">${C.n}</span><button class="step" onclick="cnt(1)">+</button></div></div>${inputs}</div>
  <div class="card"><div class="mut" style="margin-bottom:8px">Rounds each</div><div class="chips">${[3,5,8].map(r=>`<button class="chip ${C.rounds==r?'on':''}" onclick="rds(${r})">${r}</button>`).join('')}</div></div>
  <div class="card" style="font-size:13px;line-height:1.55;color:#aab">🟢 Pass the phone. Pick 1 of 6 mystery buttons before the timer dies.<br>💥 Steal points · 🔁 reverse order · 💣 bombs · 🤪 group challenges · and some buttons <b style="color:var(--g1)">rewrite the rules</b>.</div>
  <button class="cta" onclick="start()">🚀 শুরু করো!</button>`+foot();
}
function save(){for(let i=0;i<C.n;i++){const e=$('#n'+i);if(e)C.names[i]=e.value}}
function cnt(d){save();C.n=Math.max(2,Math.min(8,C.n+d));setup()}
function rds(r){save();C.rounds=r;setup()}

function start(){
  save();
  G={p:[],cur:0,dir:1,t:0,total:C.n*C.rounds,bomb:null,rules:{double:0,invert:0,shuffle:0,speed:0},note:''};
  for(let i=0;i<C.n;i++)G.p.push({name:(C.names[i]||'').trim()||'Player '+(i+1),c:COL[i],a:AV[i],s:0});
  handoff();
}
const P=()=>G.p[G.cur];
function add(i,n){
  if(G.rules.invert)n=-n;
  if(G.rules.double)n*=2;
  G.p[i].s+=n;return n;
}
const sgn=n=>(n>0?'+':'')+n;

function handoff(){
  clearInterval(T);clearInterval(SH);
  const p=P(), note=G.note;G.note='';
  app.innerHTML=`<div class="center" style="padding-top:20px"><div class="mut">Turn ${G.t+1} / ${G.total} ${G.dir<0?'· 🔁 reversed':''}</div>
  ${note?`<div class="card bomb" style="margin-top:12px">${note}</div>`:''}
  <div class="av" style="background:${p.c}33;border:3px solid ${p.c}">${p.a}</div>
  <h2 style="font-size:34px;color:${p.c}">${esc(p.name)}</h2>
  <p style="color:#9aa;margin:6px 0 4px">ফোনটা ${esc(p.name)}-এর হাতে দাও 📱</p>
  <p class="mut" style="margin:0 0 22px">Score: ${p.s}</p>
  <button class="cta" onclick="play()">আমি রেডি 👀</button></div>`;
}

function chips(){
  let h='';const r=G.rules;
  if(r.double)h+=`<span class="tag">✨ Double points · ${r.double}</span>`;
  if(r.invert)h+=`<span class="tag bad">🙃 Inverted points · ${r.invert}</span>`;
  if(r.shuffle)h+=`<span class="tag bad">🌪️ Buttons dancing · ${r.shuffle}</span>`;
  if(r.speed)h+=`<span class="tag bad">⚡ Speed 5s · ${r.speed}</span>`;
  if(G.bomb)h+=`<span class="tag bad">💣 ${esc(G.p[G.bomb.h].name)} · ${G.bomb.left} turns</span>`;
  return h;
}
function strip(){return `<div class="strip" style="margin-bottom:10px">${G.p.map((p,i)=>`<div class="pl ${i==G.cur?'me':''}" style="color:${p.c}">${p.a}<br>${esc(p.name)}<b>${p.s}</b></div>`).join('')}</div>`}

let BT=[],ORD=[],TL=0,TM=10;
function play(){
  const p=P();
  BT=Array.from({length:6},(_,i)=>({k:rnd(POOL),g:GL[(Math.random()*GL.length)|0]}));
  ORD=[0,1,2,3,4,5];
  TM=G.rules.speed?5:10;TL=TM;
  app.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="mut">Round ${Math.floor(G.t/G.p.length)+1}/${C.rounds}</span><span class="ff" style="color:${p.c}">${p.a} ${esc(p.name)}</span></div>
  ${strip()}<div style="min-height:8px;text-align:center;margin-bottom:6px">${chips()}</div>
  <div class="ring"><svg width="76" height="76"><circle cx="38" cy="38" r="32" fill="none" stroke="#1a1a26" stroke-width="7"/><circle id="rc" cx="38" cy="38" r="32" fill="none" stroke="#2ED573" stroke-width="7" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="0"/></svg><span id="tx">${TL}</span></div>
  <div class="center mut" style="margin-bottom:10px">কোনটা? জলদি চাপো!</div><div class="grid" id="gr"></div>`;
  draw();
  const t0=Date.now();
  T=setInterval(()=>{
    const el=(Date.now()-t0)/1000, left=Math.max(0,TM-el);
    const rc=$('#rc');if(!rc)return;
    rc.style.strokeDashoffset=201*(1-left/TM);
    rc.style.stroke=left>TM*.5?'#2ED573':left>TM*.25?'#FFA502':'#FF4757';
    $('#tx').textContent=Math.ceil(left);
    if(left<=0){clearInterval(T);press(rnd(ORD),true)}
  },100);
  if(G.rules.shuffle)SH=setInterval(()=>{ORD.sort(()=>Math.random()-.5);draw(true)},1100);
}
function draw(){
  const g=$('#gr');if(!g)return;
  g.innerHTML=ORD.map(i=>`<button class="bt" style="animation-delay:${i*.05}s" onclick="press(${i})">${BT[i].g}<small>#${i+1}</small></button>`).join('');
}

function press(i,late){
  clearInterval(T);clearInterval(SH);
  const k=BT[i].k, me=G.cur, p=P(), L=[];
  let e,t,d,after=null;
  if(late){const n=add(me,-1);L.push(`⏰ Too slow! ${sgn(n)}`)}
  const S=G.p.length;
  switch(k){
    case 'jackpot':{const n=add(me,3);e='🎰';t='JACKPOT!';d=`${p.name} ${sgn(n)} points. কপাল ভালো!`;break}
    case 'small':{const n=add(me,1);e='🍬';t='Small win';d=`${sgn(n)} point. Meh, but fine.`;break}
    case 'dud':e='🫥';t='Ajaira Dud';d='কিছুই হয়নি। Literally nothing. Nice button, though.';break;
    case 'karma':{const n=add(me,-2);e='🪤';t='Karma!';d=`${sgn(n)} points. Too greedy!`;break}
    case 'steal':{
      const o=G.p.map((q,j)=>j).filter(j=>j!=me).sort((a,b)=>G.p[b].s-G.p[a].s)[0];
      G.p[o].s-=2;const n=add(me,2);e='🦹';t='STEAL!';d=`${p.name} stole 2 points from ${G.p[o].name}, the current leader! (${sgn(n)} for ${p.name})`;break}
    case 'reverse':G.dir*=-1;e='🔁';t='REVERSE!';d='Turn order flipped. Everyone is confused. Perfect.';break;
    case 'bomb':G.bomb={h:me,left:3};e='💣';t='BOMB!';d=`A 3-turn countdown starts on ${p.name}. Hit 🧯 Defuse or lose 5 points!`;break;
    case 'defuse':if(G.bomb){const h=G.p[G.bomb.h].name;G.bomb=null;const n=add(me,1);e='🧯';t='Defused!';d=`The bomb on ${h} is gone. ${sgn(n)} for you.`}else{const n=add(me,1);e='🧯';t='Defuser (nothing to defuse)';d=`${sgn(n)} point for the effort.`}break;
    case 'challenge':e='🤪';t='GROUP CHALLENGE!';d=rnd(CH);after='ch';break;
    case 'rule':{
      const r=rnd(['double','invert','shuffle','speed','swap']);
      if(r=='swap'){const s=[...G.p].map((q,j)=>j).sort((a,b)=>G.p[a].s-G.p[b].s),lo=s[0],hi=s[s.length-1];
        if(G.p[lo].s==G.p[hi].s){e='🌀';t='RULE: Swap Scores';d='Everyone is tied, so… nothing swaps. Awkward.'}
        else{const x=G.p[lo].s;G.p[lo].s=G.p[hi].s;G.p[hi].s=x;e='🔄';t='RULE: Swap Scores';d=`${G.p[lo].name} and ${G.p[hi].name} swapped scores. Boom!`}}
      else{const m={double:['✨','Double Points','All gains and losses ×2'],invert:['🙃','Inverted Points','Good becomes bad, bad becomes good'],shuffle:['🌪️','Dancing Buttons','Buttons keep moving. Good luck!'],speed:['⚡','Speed Mode','Only 5 seconds per turn']}[r];
        G.rules[r]=4;e=m[0];t='RULE: '+m[1];d=m[2]+' for the next 3 turns.'}
      break}
  }
  const col=p.c;
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="card"><div class="mut">${esc(p.name)} pressed #${i+1}</div><div class="emo">${e}</div><h2 style="font-size:28px;color:${k=='rule'?'var(--gold)':'var(--g1)'};margin:6px 0">${t}</h2><p style="line-height:1.5;margin:6px 0 ${L.length?4:16}px;${after=='ch'?'font-size:18px;color:#fff':'color:#bcc'}">${esc(d)}</p>${L.length?`<p style="color:#ff8d98;margin:0 0 14px">${L.join(' ')}</p>`:''}<button class="cta sm" id="ok">${after=='ch'?'কে জিতলো? 🏆':'পরেরটা ➜'}</button></div>`;
  document.body.appendChild(ov);
  $('#ok').onclick=()=>{ov.remove();after=='ch'?pickWinner():next()};
}
function pickWinner(){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="card"><h2 style="font-size:24px;color:var(--gold)">Who won the challenge? 🏆</h2><p class="mut" style="margin:6px 0 12px">Winner gets +2 · or nobody</p><div class="wins">${G.p.map((p,i)=>`<button style="border-color:${p.c}" data-i="${i}"><span>${p.a}</span>${esc(p.name)}</button>`).join('')}</div><button class="chip" style="width:100%;margin-top:12px" id="none">Nobody 😅</button></div>`;
  document.body.appendChild(ov);
  ov.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{add(+b.dataset.i,2);ov.remove();next()});
  $('#none').onclick=()=>{ov.remove();next()};
}

function next(){
  G.t++;
  for(const k in G.rules)if(G.rules[k]>0)G.rules[k]--;
  if(G.bomb){G.bomb.left--;
    if(G.bomb.left<=0){const h=G.bomb.h;G.p[h].s-=5;G.note=`💥 BOOM! ${esc(G.p[h].name)}'s bomb exploded. −5 points!`;G.bomb=null}}
  if(G.t>=G.total)return end();
  G.cur=(G.cur+G.dir+G.p.length)%G.p.length;
  handoff();
}
function end(){
  clearInterval(T);clearInterval(SH);
  const s=[...G.p].sort((a,b)=>b.s-a.s), max=Math.max(...s.map(x=>Math.abs(x.s)),1);
  app.innerHTML=logo('GAME OVER')+`<div class="card center"><div class="emo">👑</div><h2 style="font-size:32px;color:${s[0].c}">${s[0].a} ${esc(s[0].name)}</h2><p style="color:var(--gold);margin:4px 0" class="big">${s[0].s} pts</p><p class="mut">Ajaira Champion</p></div>
  <div class="card">${s.map((p,i)=>`<div class="row" style="margin-bottom:9px"><span class="dot" style="background:${p.c}">${p.a}</span><span style="width:70px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span><div class="bar"><i style="width:${Math.max(4,Math.abs(p.s)/max*100)}%;background:${p.c}"></i></div><b class="ff" style="width:34px;text-align:right">${p.s}</b></div>`).join('')}</div>
  <button class="cta" onclick="start()">🔁 আবার খেলি!</button><button class="chip" style="width:100%;margin-top:10px" onclick="setup()">⚙️ Change players</button>`+foot();
}

      const t=(n-t0)/1e3,d=io(cl((t-.3)/2.6)),lit=cl(d*2.2),a=-2.2*Math.sin(Math.PI*cl(t/.4))*(1-d)+84*d;
      dl.style.transform=`rotateY(${a}deg)`;dr.style.transform=`rotateY(${-a}deg)`;

      well.style.opacity=lit;stg.style.transition='none';stg.style.opacity=1-cl((t-2.7)/.6);
      stk.style.opacity=Math.sin(Math.PI*cl(t/1.8))*.9;
      const z=1180*Math.pow(cl((t-.9)/2.6),2.1),amp=6*Math.max(0,1-t)+2*Math.max(0,1-Math.abs(t-.5));
      cam.style.transform=`translate3d(${Math.sin(t*75)*amp}px,${Math.cos(t*61)*amp*.6}px,${z}px)`;
      if(!w1&&t>1.2){w1=1;whoosh()}if(!w2&&t>3.2){w2=1;ov.classList.add('ttl-on');boom();hit()}if(!w3&&t>5.1){w3=1;BGM.start()}
      if(t>.3&&t<3)for(let i=0;i<5;i++){const s=Math.random()<.5?-1:1;PS.push({x:cx+(Math.random()-.5)*6,y:cy+(Math.random()-.5)*S*.7,vx:s*(40+Math.random()*220)*(.4+d),vy:(Math.random()-.5)*60,r:Math.random()*2+.6,l:1})}
      x.clearRect(0,0,pc.width,pc.height);x.globalCompositeOperation='lighter';
      PS=PS.filter(p=>(p.l-=.011)>0);
      for(const p of PS){p.x+=p.vx*.016;p.y+=p.vy*.016;x.fillStyle=`rgba(170,255,175,${p.l*.85})`;x.beginPath();x.arc(p.x,p.y,p.r*(1+(1-p.l)*1.5),0,7);x.fill()}
      t<6.6?raf=requestAnimationFrame(f):done();
    };
    raf=requestAnimationFrame(f);
  }
  function go(){
    if(started)return;started=true;snd();
    ov.querySelector('.gate').remove();ov.style.cursor='default';

      const step=n=>{const p=Math.min(1,(n-t0)/D),a=360*ease(p);spin.style.transform=`rotate(${a}deg)`;
        const k=Math.floor(a/15);if(k!==last){last=k;tick(p<.5?p*2:(1-p)*2)}
        if(p<1)raf=requestAnimationFrame(step);else{spin.style.transform='none';ov.classList.add('lock');lock();navigator.vibrate&&navigator.vibrate([30,40,60])}};
      raf=requestAnimationFrame(step)},2300);
    to(()=>{ov.classList.add('open');opn();openAnim()},6100);
  }

}
